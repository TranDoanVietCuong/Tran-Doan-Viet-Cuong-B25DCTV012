<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính cá nhân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="may-tinh"> 
        <!-- Phần hiển thị kết quả -->
        <div id="man-hinh">0</div>
        
        <div class="ban-phim">
            <button class="nut xoa">C</button>
            <button class="nut toan-tu">/</button>
            <button class="nut toan-tu">*</button>
            <button class="nut toan-tu">-</button>

            <button class="nut">7</button>
            <button class="nut">8</button>
            <button class="nut">9</button>
            <button class="nut toan-tu">+</button>

            <button class="nut">4</button>
            <button class="nut">5</button>
            <button class="nut">6</button>
            <button class="nut bang">=</button>

            <button class="nut">1</button>
            <button class="nut">2</button>
            <button class="nut">3</button>
            
            <button class="nut so-khong">0</button>
            <button class="nut">.</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
